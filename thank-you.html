<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you — Wonder Bowl</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/web/favicon.svg" />

  <!-- Same consent-gated analytics as the main site (shares consent choice). -->
  <script src="analytics.js"></script>

  <link rel="stylesheet" href="https://use.typekit.net/nnr5kpw.css" />

  <!-- Which design did this buyer come through?
       Stripe's hosted checkout returns every buyer to one fixed success URL and
       will not pass our own parameters through it, so the answer has to survive
       the round-trip through stripe.com. lux.html writes wb_design into
       localStorage before handing off; same-origin, so it is still here.

       The stylesheet is appended synchronously during head parsing, which keeps
       it render-blocking exactly like a static <link> — no flash, and only the
       one that is actually needed gets fetched. No flag, or no JS, or a buyer
       who paid on another device: the classic look, unchanged. -->
  <script>
    (function () {
      var lux = false;
      try { lux = localStorage.getItem("wb_design") === "lux"; } catch (e) {}
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = lux ? "lux.css" : "styles.css";
      document.head.appendChild(l);
      if (lux) document.documentElement.setAttribute("data-design", "lux");
    })();
  </script>
  <noscript><link rel="stylesheet" href="styles.css" /></noscript>
</head>
<body>
  <section class="field field--pink band band--ink lux-thanks" style="min-height:100vh;display:grid;place-items:center;text-align:center;">
    <div class="wrap" style="max-width:640px;">
      <img src="assets/web/logo-white-crop.svg" alt="Wonder Bowl" style="height:60px;width:auto;margin:0 auto 1.5rem;" />
      <h1>Thank you — your bowls are on the way!</h1>
      <p class="lede" style="margin:1rem auto 1.75rem;max-width:44ch;">
        We've got your order. We'll email you to confirm your San Francisco delivery day —
        keep an eye out, good things are simmering.
      </p>
      <a class="btn btn--primary btn--lg" id="back-link" href="index.html">Back to Wonder Bowl</a>
      <p class="final-cta__fine" style="margin-top:1.25rem;">A mealtime pic + honest feedback is all we ask in return. 🐾</p>
    </div>
  </section>

  <script>
    // Fire the completed-purchase event once, after Stripe redirects here.
    //
    // Stripe Payment Link success URL should be:
    //   https://wonder-bowl.com/thank-you?tier=small&session_id={CHECKOUT_SESSION_ID}
    //
    // The session_id matters: GA4 de-duplicates purchases by transaction_id, so
    // without it every buyer of a given tier shares one id and only the first is
    // counted. Stripe substitutes {CHECKOUT_SESSION_ID} literally — keep the braces.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var raw = (params.get("tier") || "").toLowerCase();
      var sessionId = params.get("session_id") || "";           // appended by Stripe
      // The Stripe links use small/medium/large; the site's internal ids are
      // 1cup/2cup/3cup. Accept either so a mismatch can't silently report $0.
      var ALIAS = {
        small: "1cup", medium: "2cup", large: "3cup",
        "1cup": "1cup", "2cup": "2cup", "3cup": "3cup"
      };
      var tier = ALIAS[raw] || raw;
      var VALUE = { "1cup": 15, "2cup": 24, "3cup": 33 };
      var value = VALUE[tier] || 0;

      function firePurchase() {
        if (!window.wbTrack || !(window.wbConsentGranted && window.wbConsentGranted())) return;
        window.wbTrack("purchase", {
          currency: "USD",
          value: value,
          tier: tier,
          transaction_id: sessionId || ("wb_" + tier + "_" + value),
          items: [{ item_id: tier, item_name: tier + " 3-day sample set", price: value, quantity: 1 }]
        });
      }
      // analytics.js loads the trackers on DOMContentLoaded (if consented); fire just after.
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { setTimeout(firePurchase, 300); });
      } else {
        setTimeout(firePurchase, 300);
      }
    })();
  </script>
  <script>
    if (document.documentElement.getAttribute("data-design") === "lux") {
      var back = document.getElementById("back-link");
      if (back) back.href = "lux.html";
    }
  </script>
</body>
</html>
